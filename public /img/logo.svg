/* Para el logo */
.logo-img{
  width: 145px;
  object-fit: contain; /* mantiene la calidad */
  filter: drop-shadow(0 0 20px rgba(0,200,255,0.6)); /* el brillo igual a la foto */
}

/* Para la foto de Lucas */
.service-photo{
  width: 100%;
  height: 100%;
  object-fit: cover; /* llena el espacio sin deformarse */
  border-radius: 28px;
}
